<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wakeweb – Setup Guide</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { overflow-x: hidden; max-width: 100%; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3249;
      --accent: #5b8af5;
      --accent-hover: #7aa3ff;
      --text: #e8eaf6;
      --muted: #8890b5;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header { text-align: center; margin-bottom: 2.5rem; }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #5b8af5, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p { color: var(--muted); margin-top: 0.4rem; font-size: 0.95rem; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      margin-top: 0.6rem;
      transition: color 0.18s;
    }
    .back-link:hover { color: var(--accent); }

    .container {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .guide-step {
      display: flex;
      gap: 1rem;
      padding: 0.8rem 0;
      border-bottom: 1px solid var(--border);
    }
    .guide-step:last-child { border-bottom: none; }

    .step-num {
      background: var(--accent);
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-content h3 { font-size: 0.93rem; font-weight: 600; margin-bottom: 0.25rem; }
    .step-content p  { font-size: 0.85rem; color: var(--muted); line-height: 1.55; }

    code {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 0.1em 0.4em;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85em;
      color: #a78bfa;
    }

    pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0.8rem 1rem;
      font-size: 0.82rem;
      color: #a78bfa;
      font-family: monospace;
      overflow-x: auto;
      max-width: 100%;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 0.5rem;
      line-height: 1.6;
    }

    .guide-section + .guide-section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .guide-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .guide-section-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .os-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 7px;
      font-size: 0.88rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .os-select:focus { border-color: var(--accent); }

    @media (max-width: 600px) {
      body { padding: 1rem 0.75rem 3rem; }
      header h1 { font-size: 1.5rem; }
      .container { gap: 1.25rem; }
      .card { padding: 1.1rem; }
      pre { font-size: 0.75rem; }
      .guide-section-head { flex-direction: column; align-items: flex-start; }
      .guide-section-head .os-select { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>wakeweb</h1>
  <p>Setup Guide</p>
  <a href="/" class="back-link">← Back</a>
</header>

<div class="container">
  <div class="card">

    <div class="guide-section">
      <div class="guide-section-head">
        <div class="guide-section-label">Server (wakeweb runs here)</div>
        <select id="server-select" class="os-select">
          <option value="debian">Debian / Ubuntu</option>
          <option value="arch">Arch / Manjaro</option>
          <option value="windows">Windows</option>
          <option value="macos">macOS</option>
          <option value="proxmox">Proxmox VE</option>
        </select>
      </div>
      <div id="server-guide"></div>
    </div>

    <div class="guide-section">
      <div class="guide-section-head">
        <div class="guide-section-label">Target device (to be woken)</div>
        <select id="device-select" class="os-select">
          <option value="windows">Windows</option>
          <option value="linux">Linux</option>
          <option value="macos">macOS</option>
          <option value="proxmox-host">Proxmox Host</option>
        </select>
      </div>
      <div id="device-guide"></div>
    </div>

  </div>
</div>

<script>
  function escHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const SVC = `[Unit]
Description=wakeweb Wake-on-LAN
After=network.target

[Service]
WorkingDirectory=/opt/wakeweb
ExecStart=/usr/bin/node server.js
Restart=always
User=nobody
Environment=NODE_ENV=production

[Install]
WantedBy=multi-user.target`;

  const PLIST = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
  "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>Label</key><string>com.user.wakeweb</string>
  <key>ProgramArguments</key>
  <array>
    <string>/usr/local/bin/node</string>
    <string>/opt/wakeweb/server.js</string>
  </array>
  <key>WorkingDirectory</key><string>/opt/wakeweb</string>
  <key>RunAtLoad</key><true/>
  <key>KeepAlive</key><true/>
</dict>
</plist>`;

  const serverGuides = {
    debian: [
      { title: 'Update system & install packages',
        blocks: [
          { t: 'p', c: 'Git and curl are required for the installation:' },
          { t: 'c', c: 'sudo apt update && sudo apt upgrade -y\nsudo apt install -y git curl' },
        ]},
      { title: 'Install Node.js 20 LTS',
        blocks: [
          { t: 'p', c: 'Add the official NodeSource repository and install Node.js:' },
          { t: 'c', c: 'curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -\nsudo apt install -y nodejs\nnode -v && npm -v' },
        ]},
      { title: 'Clone project & install dependencies',
        blocks: [
          { t: 'c', c: 'git clone https://github.com/Orangezeiger/wakeweb /opt/wakeweb\ncd /opt/wakeweb\nnpm install' },
        ]},
      { title: 'Configuration',
        blocks: [
          { t: 'p', c: 'Create the environment file and adjust the port if needed (default: 3000):' },
          { t: 'c', c: 'cp .env.example .env\nnano .env\n# PORT=3000' },
        ]},
      { title: 'Test run',
        blocks: [
          { t: 'c', c: 'cd /opt/wakeweb && npm start' },
          { t: 'p', c: 'Open <code>http://SERVER-IP:3000</code> in your browser. Stop with <code>Ctrl+C</code>.' },
        ]},
      { title: 'Set up as a persistent systemd service',
        blocks: [
          { t: 'p', c: 'Create the service file:' },
          { t: 'c', c: 'sudo nano /etc/systemd/system/wakeweb.service' },
          { t: 'p', c: 'Paste the following content:' },
          { t: 'c', c: SVC },
          { t: 'p', c: 'Enable the service and start it on boot:' },
          { t: 'c', c: 'sudo systemctl daemon-reload\nsudo systemctl enable --now wakeweb\nsudo systemctl status wakeweb' },
        ]},
    ],

    arch: [
      { title: 'Install packages',
        blocks: [
          { t: 'p', c: 'Install Git and Node.js via the official package manager:' },
          { t: 'c', c: 'sudo pacman -Syu\nsudo pacman -S git nodejs npm' },
        ]},
      { title: 'Clone project & install dependencies',
        blocks: [
          { t: 'c', c: 'git clone https://github.com/Orangezeiger/wakeweb /opt/wakeweb\ncd /opt/wakeweb\nnpm install' },
        ]},
      { title: 'Configuration',
        blocks: [
          { t: 'c', c: 'cp .env.example .env\nnano .env\n# PORT=3000' },
        ]},
      { title: 'Test run',
        blocks: [
          { t: 'c', c: 'npm start' },
          { t: 'p', c: 'Open <code>http://SERVER-IP:3000</code> in your browser. Stop with <code>Ctrl+C</code>.' },
        ]},
      { title: 'Set up as a persistent systemd service',
        blocks: [
          { t: 'c', c: 'sudo nano /etc/systemd/system/wakeweb.service' },
          { t: 'p', c: 'Paste the following content:' },
          { t: 'c', c: SVC },
          { t: 'c', c: 'sudo systemctl daemon-reload\nsudo systemctl enable --now wakeweb\nsudo systemctl status wakeweb' },
        ]},
    ],

    windows: [
      { title: 'Install Node.js',
        blocks: [
          { t: 'p', c: 'Download Node.js LTS (v20) from <code>nodejs.org</code> and run the installer. Make sure <strong>"Add to PATH"</strong> is checked.' },
          { t: 'p', c: 'Verify the installation in PowerShell:' },
          { t: 'c', c: 'node -v\nnpm -v' },
        ]},
      { title: 'Install Git for Windows',
        blocks: [
          { t: 'p', c: 'Download Git from <code>git-scm.com</code> and install it. The default settings in the installer are fine.' },
        ]},
      { title: 'Clone project & install dependencies',
        blocks: [
          { t: 'p', c: 'Open PowerShell or Git Bash:' },
          { t: 'c', c: 'git clone https://github.com/Orangezeiger/wakeweb C:\\wakeweb\ncd C:\\wakeweb\nnpm install' },
        ]},
      { title: 'Configuration',
        blocks: [
          { t: 'c', c: 'copy .env.example .env\nnotepad .env' },
          { t: 'p', c: 'Adjust <code>PORT=3000</code> if needed, then save.' },
        ]},
      { title: 'Start',
        blocks: [
          { t: 'c', c: 'npm start' },
          { t: 'p', c: 'Open <code>http://localhost:3000</code> in your browser. Stop with <code>Ctrl+C</code>.' },
        ]},
      { title: 'Autostart via Task Scheduler',
        blocks: [
          { t: 'p', c: 'Create a start script – create <code>C:\\wakeweb\\start.bat</code> with the following content:' },
          { t: 'c', c: '@echo off\ncd C:\\wakeweb\nnode server.js' },
          { t: 'p', c: 'Register the task in an <strong>Administrator PowerShell</strong>:' },
          { t: 'c', c: 'schtasks /create /tn "wakeweb" /tr "C:\\wakeweb\\start.bat" /sc onstart /ru SYSTEM /f' },
        ]},
    ],

    macos: [
      { title: 'Install Homebrew',
        blocks: [
          { t: 'p', c: 'Homebrew is the recommended package manager for macOS:' },
          { t: 'c', c: '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"' },
        ]},
      { title: 'Install Node.js',
        blocks: [
          { t: 'c', c: 'brew install node\nnode -v && npm -v' },
          { t: 'p', c: 'Alternatively use the installer from <code>nodejs.org</code>.' },
        ]},
      { title: 'Clone project & install dependencies',
        blocks: [
          { t: 'c', c: 'git clone https://github.com/Orangezeiger/wakeweb /opt/wakeweb\ncd /opt/wakeweb\nnpm install' },
        ]},
      { title: 'Configuration',
        blocks: [
          { t: 'c', c: 'cp .env.example .env\nnano .env\n# PORT=3000' },
        ]},
      { title: 'Test run',
        blocks: [
          { t: 'c', c: 'npm start' },
          { t: 'p', c: 'Open <code>http://localhost:3000</code> in your browser. Stop with <code>Ctrl+C</code>.' },
        ]},
      { title: 'Autostart via LaunchAgent',
        blocks: [
          { t: 'p', c: 'Create the plist file (adjust paths if needed):' },
          { t: 'c', c: 'nano ~/Library/LaunchAgents/com.user.wakeweb.plist' },
          { t: 'p', c: 'Paste the following content:' },
          { t: 'c', c: PLIST },
          { t: 'p', c: 'Load the LaunchAgent:' },
          { t: 'c', c: 'launchctl load ~/Library/LaunchAgents/com.user.wakeweb.plist' },
        ]},
    ],

    proxmox: [
      { title: 'Create LXC container',
        blocks: [
          { t: 'p', c: 'In the <strong>Proxmox web UI</strong> under <em>Datacenter → Create CT</em>:<br><br>• Template: <strong>Debian 12 (Bookworm)</strong> – download via the Proxmox storage button<br>• RAM: at least 256 MB (512 MB recommended)<br>• Disk: 4 GB is sufficient<br>• Network: bridge <code>vmbr0</code>, DHCP or static IP<br>• Privileged: No (unprivileged container is fine)' },
        ]},
      { title: 'Start container & log in',
        blocks: [
          { t: 'p', c: 'Start the container via the Proxmox web console or from the Proxmox host (e.g. ID 100):' },
          { t: 'c', c: 'pct start 100\npct exec 100 -- bash' },
          { t: 'p', c: 'Alternatively open the console via <strong>Container → Console</strong> in the web UI.' },
        ]},
      { title: 'Update system & install packages',
        blocks: [
          { t: 'c', c: 'apt update && apt upgrade -y\napt install -y git curl' },
        ]},
      { title: 'Install Node.js 20 LTS',
        blocks: [
          { t: 'c', c: 'curl -fsSL https://deb.nodesource.com/setup_20.x | bash -\napt install -y nodejs\nnode -v && npm -v' },
        ]},
      { title: 'Clone project & install dependencies',
        blocks: [
          { t: 'c', c: 'git clone https://github.com/Orangezeiger/wakeweb /opt/wakeweb\ncd /opt/wakeweb\nnpm install' },
        ]},
      { title: 'Configuration & network',
        blocks: [
          { t: 'p', c: '<strong>Important:</strong> The broadcast address of your home network must be set so WoL packets reach the network.' },
          { t: 'c', c: 'cp .env.example .env\nnano .env\n# PORT=3000\n# BROADCAST_ADDR=192.168.1.255  ← adjust' },
          { t: 'p', c: 'Find the broadcast address on the Proxmox host:' },
          { t: 'c', c: 'ip addr show vmbr0\n# Example: inet 192.168.1.10/24 → broadcast 192.168.1.255' },
        ]},
      { title: 'Set up as a persistent systemd service',
        blocks: [
          { t: 'c', c: 'nano /etc/systemd/system/wakeweb.service' },
          { t: 'p', c: 'Paste the following content:' },
          { t: 'c', c: SVC },
          { t: 'c', c: 'systemctl daemon-reload\nsystemctl enable --now wakeweb\nsystemctl status wakeweb' },
        ]},
    ],
  };

  const deviceGuides = {
    windows: [
      { title: 'Enable WoL in BIOS / UEFI',
        blocks: [
          { t: 'p', c: 'Start the PC and open BIOS/UEFI (<strong>F2</strong>, <strong>DEL</strong> or <strong>F12</strong> – depends on manufacturer). Enable the <em>Wake on LAN</em> or <em>Power On By PCI-E/NIC</em> option, save and reboot.' },
        ]},
      { title: 'Configure network driver',
        blocks: [
          { t: 'p', c: '<strong>Open Device Manager</strong> (Win+X → Device Manager):<br><br>1. Network adapters → double-click the LAN card<br>2. Tab <em>Power Management</em> → check all three boxes<br>3. Tab <em>Advanced</em> → property <em>Wake on Magic Packet</em> → value: <em>Enabled</em>' },
        ]},
      { title: 'Disable Fast Startup',
        blocks: [
          { t: 'p', c: 'Windows Fast Startup prevents WoL because it does not perform a real shutdown.<br><br><strong>Control Panel → Power Options → Choose what the power buttons do → Turn on fast startup → uncheck → Save changes</strong>' },
        ]},
      { title: 'Find MAC address',
        blocks: [
          { t: 'c', c: 'ipconfig /all' },
          { t: 'p', c: 'Note the <em>Physical Address</em> of the desired LAN adapter, e.g. <code>A1-B2-C3-D4-E5-F6</code>.' },
        ]},
    ],

    linux: [
      { title: 'Enable WoL in BIOS / UEFI',
        blocks: [
          { t: 'p', c: 'Start the PC and open BIOS/UEFI (<strong>F2</strong>, <strong>DEL</strong> or <strong>Delete</strong>). Enable <em>Wake on LAN</em> or <em>Wake on PCI-E</em>, save and reboot.' },
        ]},
      { title: 'Install ethtool & check WoL status',
        blocks: [
          { t: 'c', c: '# Debian/Ubuntu:\nsudo apt install -y ethtool\n\n# Arch/Manjaro:\nsudo pacman -S ethtool' },
          { t: 'p', c: 'Find your network interface name and check the WoL status (adjust name if needed):' },
          { t: 'c', c: 'ip link show\nsudo ethtool enp3s0 | grep -i wake\n# "Wake-on: g" = WoL already active' },
        ]},
      { title: 'Enable WoL',
        blocks: [
          { t: 'c', c: 'sudo ethtool -s enp3s0 wol g' },
        ]},
      { title: 'Persist WoL across reboots (systemd.link)',
        blocks: [
          { t: 'c', c: 'sudo nano /etc/systemd/network/50-wol.link' },
          { t: 'p', c: 'Paste the following content (adjust MAC address):' },
          { t: 'c', c: '[Match]\nMACAddress=a1:b2:c3:d4:e5:f6\n\n[Link]\nWakeOnLan=magic' },
          { t: 'c', c: 'sudo systemctl restart systemd-networkd' },
        ]},
      { title: 'Find MAC address',
        blocks: [
          { t: 'c', c: 'ip link show\n# or:\ncat /sys/class/net/enp3s0/address' },
        ]},
    ],

    macos: [
      { title: 'Enable WoL in System Settings',
        blocks: [
          { t: 'p', c: '<strong>System Settings → Energy Saver</strong> (macOS Ventura+: <em>Settings → Battery/Power</em>) → enable <em>Wake for network access</em>.' },
          { t: 'p', c: '<strong>Note for Apple Silicon (M1/M2/M3):</strong> Wake-on-LAN via Magic Packet is not reliably supported on Apple Silicon Macs. Intel Macs work without issues.' },
        ]},
      { title: 'Check & enable WoL via Terminal',
        blocks: [
          { t: 'c', c: 'pmset -g | grep womp\n# womp 1 = WoL active' },
          { t: 'p', c: 'Enable WoL via Terminal (as administrator):' },
          { t: 'c', c: 'sudo pmset -a womp 1' },
        ]},
      { title: 'Find MAC address',
        blocks: [
          { t: 'c', c: 'ifconfig en0 | grep ether' },
          { t: 'p', c: 'Or via <strong>System Settings → Network → Details → Hardware</strong>.' },
        ]},
    ],

    'proxmox-host': [
      { title: 'Enable WoL in BIOS / UEFI',
        blocks: [
          { t: 'p', c: 'Start the server and open BIOS/UEFI. Enable <em>Wake on LAN</em> or <em>Wake on PCI-E</em>, save and reboot.' },
        ]},
      { title: 'Find network interface',
        blocks: [
          { t: 'c', c: 'ip link show\n# e.g. eno1, enp3s0, eth0' },
        ]},
      { title: 'Enable WoL (ethtool)',
        blocks: [
          { t: 'c', c: 'apt install -y ethtool\nsudo ethtool -s eno1 wol g\nsudo ethtool eno1 | grep -i wake' },
        ]},
      { title: 'Persist WoL across reboots',
        blocks: [
          { t: 'c', c: 'nano /etc/systemd/network/50-wol.link' },
          { t: 'p', c: 'Paste the following content (adjust MAC address):' },
          { t: 'c', c: '[Match]\nMACAddress=a1:b2:c3:d4:e5:f6\n\n[Link]\nWakeOnLan=magic' },
          { t: 'c', c: 'systemctl restart systemd-networkd' },
        ]},
      { title: 'Auto-start VMs on boot',
        blocks: [
          { t: 'p', c: 'In the Proxmox web UI: <strong>select VM → Options → Start at boot → Yes</strong>' },
          { t: 'p', c: 'Or via CLI:' },
          { t: 'c', c: 'qm set 100 --onboot 1\n# 100 = VM ID' },
        ]},
      { title: 'Find the physical network port MAC address',
        blocks: [
          { t: 'p', c: 'Important: use the MAC address of the <strong>physical port</strong>, not the bridge <code>vmbr0</code>.' },
          { t: 'c', c: 'ip link show eno1\n# or:\ncat /sys/class/net/eno1/address' },
        ]},
    ],
  };

  function renderSteps(containerId, steps) {
    document.getElementById(containerId).innerHTML = steps.map((step, i) => `
      <div class="guide-step">
        <div class="step-num">${i + 1}</div>
        <div class="step-content">
          <h3>${escHtml(step.title)}</h3>
          ${step.blocks.map(b =>
            b.t === 'c'
              ? `<pre>${escHtml(b.c)}</pre>`
              : `<p>${b.c}</p>`
          ).join('')}
        </div>
      </div>`).join('');
  }

  const serverSel = document.getElementById('server-select');
  const deviceSel = document.getElementById('device-select');
  serverSel.addEventListener('change', () => renderSteps('server-guide', serverGuides[serverSel.value]));
  deviceSel.addEventListener('change', () => renderSteps('device-guide', deviceGuides[deviceSel.value]));
  renderSteps('server-guide', serverGuides[serverSel.value]);
  renderSteps('device-guide', deviceGuides[deviceSel.value]);
</script>
</body>
</html>
