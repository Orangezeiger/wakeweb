<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wakeweb – Wake-on-LAN</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { overflow-x: hidden; max-width: 100%; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3249;
      --accent: #5b8af5;
      --accent-hover: #7aa3ff;
      --danger: #e05252;
      --success: #4caf7d;
      --text: #e8eaf6;
      --muted: #8890b5;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #5b8af5, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    .hero-actions {
      margin-top: 2rem;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.65rem 1.3rem;
      border: none;
      border-radius: 8px;
      font-size: 0.93rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

    .btn-wake {
      background: var(--success);
      color: #fff;
      font-size: 0.82rem;
      padding: 0.45rem 0.9rem;
    }
    .btn-wake:hover { background: #5dca93; }
    .btn-wake:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      font-size: 0.82rem;
      padding: 0.45rem 0.9rem;
    }
    .btn-delete:hover { background: var(--danger); color: #fff; }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      transform: translateY(12px) scale(0.98);
      transition: transform 0.2s;
      overflow: hidden;
    }

    .modal-backdrop.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.2rem;
      display: flex;
      align-items: center;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
    }
    .modal-close:hover { color: var(--text); background: var(--surface2); }

    .modal-body {
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── Add Form ── */
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.8rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.65rem;
      align-items: end;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .form-group input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.85rem;
      border-radius: 7px;
      font-size: 0.93rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus { border-color: var(--accent); }
    .form-group input::placeholder { color: var(--muted); opacity: 0.6; }

    /* ── Device List ── */
    #device-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .device-item {
      display: flex;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      gap: 1rem;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .device-info { flex: 1; min-width: 0; }

    .device-name {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .device-mac {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: monospace;
      margin-top: 0.1rem;
    }

    .device-actions { display: flex; gap: 0.45rem; flex-shrink: 0; }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 1.5rem;
      font-size: 0.9rem;
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 200;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1.2rem;
      font-size: 0.88rem;
      max-width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      animation: slideIn 0.22s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--danger); }

    /* ── Footer links ── */
    .footer-links {
      margin-top: 2.5rem;
      display: flex;
      gap: 1.25rem;
      justify-content: center;
    }

    .footer-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.18s;
    }
    .footer-links a:hover { color: var(--accent); }

    @media (max-width: 560px) {
      .hero h1 { font-size: 2.2rem; }

      .form-row { grid-template-columns: 1fr; }
      .form-row .btn { width: 100%; justify-content: center; }

      .device-item { flex-wrap: wrap; }
      .device-info { flex: 1 1 100%; }
      .device-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
      .device-actions .btn { justify-content: center; }

      #toast-container { left: 0.75rem; right: 0.75rem; bottom: 0.75rem; }
      .toast { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="hero">
  <h1>wakeweb</h1>
  <p>Wake-on-LAN im Browser</p>
  <div class="hero-actions">
    <button class="btn btn-primary" id="open-modal">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      Geräte verwalten
    </button>
  </div>
  <div class="footer-links">
    <a href="/guide.html">Einrichtungsanleitung →</a>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title">Geräte</span>
      <button class="modal-close" id="close-modal" aria-label="Schließen">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">

      <!-- Device List -->
      <div>
        <div class="section-label">Geräteliste</div>
        <div id="device-list">
          <div class="empty-state">Lade Geräte…</div>
        </div>
      </div>

      <!-- Add Form -->
      <div>
        <div class="section-label">Gerät hinzufügen</div>
        <form id="add-form">
          <div class="form-row">
            <div class="form-group">
              <label for="input-name">Name</label>
              <input id="input-name" type="text" placeholder="z.B. Heimserver" required />
            </div>
            <div class="form-group">
              <label for="input-mac">MAC-Adresse</label>
              <input id="input-mac" type="text" placeholder="AA:BB:CC:DD:EE:FF" required />
            </div>
            <button type="submit" class="btn btn-primary">+ Hinzufügen</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
  const list    = document.getElementById('device-list');
  const form    = document.getElementById('add-form');
  const backdrop = document.getElementById('modal-backdrop');

  document.getElementById('open-modal').addEventListener('click', () => {
    backdrop.classList.add('open');
    loadDevices();
  });

  document.getElementById('close-modal').addEventListener('click', closeModal);

  backdrop.addEventListener('click', e => {
    if (e.target === backdrop) closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  function closeModal() {
    backdrop.classList.remove('open');
  }

  function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  async function api(method, url, body) {
    const res = await fetch(url, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    return res.json();
  }

  function escHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderDevices(devices) {
    if (!devices.length) {
      list.innerHTML = '<div class="empty-state">Noch keine Geräte. Füge unten ein Gerät hinzu.</div>';
      return;
    }
    list.innerHTML = '';
    devices.forEach(d => {
      const item = document.createElement('div');
      item.className = 'device-item';
      item.innerHTML = `
        <div class="device-info">
          <div class="device-name">${escHtml(d.name)}</div>
          <div class="device-mac">${escHtml(d.mac)}</div>
        </div>
        <div class="device-actions">
          <button class="btn btn-wake" data-id="${d.id}"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="pointer-events:none"><polygon points="5 3 19 12 5 21 5 3"/></svg> Start</button>
          <button class="btn btn-delete" data-id="${d.id}"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg> Löschen</button>
        </div>`;
      list.appendChild(item);
    });
  }

  async function loadDevices() {
    const devices = await api('GET', '/api/devices');
    renderDevices(devices);
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('input-name').value.trim();
    const mac  = document.getElementById('input-mac').value.trim();
    const res = await api('POST', '/api/devices', { name, mac });
    if (res.error) { toast(res.error, 'error'); return; }
    toast(`${res.name} hinzugefügt.`);
    form.reset();
    loadDevices();
  });

  list.addEventListener('click', async e => {
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    const id = btn.dataset.id;

    if (btn.classList.contains('btn-wake')) {
      btn.disabled = true;
      const res = await api('POST', `/api/devices/${id}/wake`);
      btn.disabled = false;
      if (res.error) { toast(res.error, 'error'); return; }
      toast(res.message);
    }

    if (btn.classList.contains('btn-delete')) {
      if (!confirm('Gerät wirklich löschen?')) return;
      const res = await api('DELETE', `/api/devices/${id}`);
      if (res.error) { toast(res.error, 'error'); return; }
      toast('Gerät gelöscht.');
      loadDevices();
    }
  });
</script>
</body>
</html>
