<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wakeweb – Wake-on-LAN</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { overflow-x: hidden; max-width: 100%; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3249;
      --accent: #5b8af5;
      --accent-hover: #7aa3ff;
      --danger: #e05252;
      --success: #4caf7d;
      --text: #e8eaf6;
      --muted: #8890b5;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #5b8af5, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .guide-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      margin-top: 0.6rem;
      transition: color 0.18s;
    }
    .guide-link:hover { color: var(--accent); }

    .container {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.1rem;
      border: none;
      border-radius: 7px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-icon {
      background: var(--accent);
      color: #fff;
      padding: 0.45rem 0.75rem;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.18s, transform 0.1s;
    }
    .btn-icon:active { transform: scale(0.97); }
    .btn-icon:hover { background: var(--accent-hover); }

    .btn-wake {
      background: var(--success);
      color: #fff;
      font-size: 0.82rem;
      padding: 0.45rem 0.9rem;
    }
    .btn-wake:hover { background: #5dca93; }
    .btn-wake:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      font-size: 0.82rem;
      padding: 0.45rem 0.9rem;
    }
    .btn-delete:hover { background: var(--danger); color: #fff; }

    /* Device List */
    #device-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .device-item {
      display: flex;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1.1rem;
      gap: 1rem;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .device-info { flex: 1; min-width: 0; }

    .device-name {
      font-weight: 600;
      font-size: 0.97rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .device-mac {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: monospace;
      margin-top: 0.15rem;
    }

    .device-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

    /* Status dot */
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.4s;
    }

    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    .status-dot.offline { background: var(--danger); }

    .status-dot.unknown { background: var(--border); }

    .status-dot.checking {
      background: #c8a820;
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
      font-size: 0.92rem;
    }

    /* Toast */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 200;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1.2rem;
      font-size: 0.88rem;
      max-width: 340px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--danger); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 500px;
      transform: translateY(10px) scale(0.98);
      transition: transform 0.2s;
      overflow: hidden;
    }

    .modal-backdrop.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.2rem;
      display: flex;
      align-items: center;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
    }
    .modal-close:hover { color: var(--text); background: var(--surface2); }

    .modal-body {
      padding: 1.4rem;
    }

    /* Form inside modal */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .form-group input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.9rem;
      border-radius: 7px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus { border-color: var(--accent); }
    .form-group input::placeholder { color: var(--muted); opacity: 0.6; }

    .form-submit {
      margin-top: 1rem;
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 600px) {
      body { padding: 1rem 0.75rem 3rem; }
      header h1 { font-size: 1.5rem; }
      .container { gap: 1.25rem; }
      .card { padding: 1.1rem; }

      .device-item { flex-wrap: wrap; gap: 0.75rem; }
      .device-info { min-width: 0; flex: 1 1 100%; }
      .device-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
      .device-actions .btn { justify-content: center; }

      .form-row { grid-template-columns: 1fr; }

      #toast-container { left: 0.75rem; right: 0.75rem; bottom: 0.75rem; }
      .toast { max-width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>wakeweb</h1>
  <p>Wake-on-LAN im Browser – Geräte per Mausklick aufwecken</p>
  <a href="/guide.html" class="guide-link">Einrichtungsanleitung →</a>
</header>

<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="card-title">Geräte</div>
      <button class="btn-icon" id="open-modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Hinzufügen
      </button>
    </div>
    <div id="device-list">
      <div class="empty-state">Lade Geräte…</div>
    </div>
  </div>
</div>

<!-- Add Device Modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <span class="modal-title">Gerät hinzufügen</span>
      <button class="modal-close" id="close-modal" aria-label="Schließen">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="add-form">
        <div class="form-row">
          <div class="form-group">
            <label for="input-name">Name</label>
            <input id="input-name" type="text" placeholder="z.B. Heimserver" required />
          </div>
          <div class="form-group">
            <label for="input-mac">MAC-Adresse</label>
            <input id="input-mac" type="text" placeholder="AA:BB:CC:DD:EE:FF" required />
          </div>
        </div>
        <div class="form-group" style="margin-top:0.65rem">
          <label for="input-ip">IP-Adresse <span style="font-weight:400;opacity:0.6">(optional – für Status-Anzeige)</span></label>
          <input id="input-ip" type="text" placeholder="192.168.1.100" />
        </div>
        <button type="submit" class="btn btn-primary form-submit">+ Hinzufügen</button>
      </form>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
  const list     = document.getElementById('device-list');
  const form     = document.getElementById('add-form');
  const backdrop = document.getElementById('modal-backdrop');

  document.getElementById('open-modal').addEventListener('click', () => {
    backdrop.classList.add('open');
    document.getElementById('input-name').focus();
  });

  document.getElementById('close-modal').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function closeModal() {
    backdrop.classList.remove('open');
  }

  function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  async function api(method, url, body) {
    const res = await fetch(url, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    return res.json();
  }

  function escHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderDevices(devices) {
    if (!devices.length) {
      list.innerHTML = '<div class="empty-state">Noch keine Geräte. Klicke auf „Hinzufügen".</div>';
      return;
    }
    list.innerHTML = '';
    devices.forEach(d => {
      const item = document.createElement('div');
      item.className = 'device-item';
      item.innerHTML = `
        <span class="status-dot checking" data-status-id="${d.id}" title="Prüfe…"></span>
        <div class="device-info">
          <div class="device-name">${escHtml(d.name)}</div>
          <div class="device-mac">${escHtml(d.mac)}</div>
        </div>
        <div class="device-actions">
          <button class="btn btn-wake" data-id="${d.id}"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="pointer-events:none"><polygon points="5 3 19 12 5 21 5 3"/></svg> Start</button>
          <button class="btn btn-delete" data-id="${d.id}"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg> Löschen</button>
        </div>`;
      list.appendChild(item);
    });
  }

  async function loadDevices() {
    const devices = await api('GET', '/api/devices');
    renderDevices(devices);
    pollStatus();
  }

  const STATUS_LABELS = { online: 'Online', offline: 'Offline', unknown: 'Kein IP konfiguriert' };

  function applyStatus(id, status) {
    document.querySelectorAll(`[data-status-id="${id}"]`).forEach(dot => {
      dot.className = `status-dot ${status}`;
      dot.title = STATUS_LABELS[status] ?? status;
    });
  }

  async function pollStatus() {
    let statuses;
    try {
      statuses = await api('GET', '/api/status');
    } catch {
      document.querySelectorAll('.status-dot').forEach(dot => {
        dot.className = 'status-dot unknown';
        dot.title = 'Nicht erreichbar';
      });
      return;
    }
    if (!statuses || typeof statuses !== 'object' || Array.isArray(statuses)) return;
    Object.entries(statuses).forEach(([id, status]) => applyStatus(id, status));
  }

  setInterval(pollStatus, 5000);

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('input-name').value.trim();
    const mac  = document.getElementById('input-mac').value.trim();
    const ip   = document.getElementById('input-ip').value.trim();
    const res = await api('POST', '/api/devices', { name, mac, ip: ip || undefined });
    if (res.error) { toast(res.error, 'error'); return; }
    toast(`${res.name} hinzugefügt.`);
    form.reset();
    closeModal();
    loadDevices();
  });

  list.addEventListener('click', async e => {
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    const id = btn.dataset.id;

    if (btn.classList.contains('btn-wake')) {
      btn.disabled = true;
      const res = await api('POST', `/api/devices/${id}/wake`);
      btn.disabled = false;
      if (res.error) { toast(res.error, 'error'); return; }
      toast(res.message);
    }

    if (btn.classList.contains('btn-delete')) {
      if (!confirm('Gerät wirklich löschen?')) return;
      const res = await api('DELETE', `/api/devices/${id}`);
      if (res.error) { toast(res.error, 'error'); return; }
      toast('Gerät gelöscht.');
      loadDevices();
    }
  });

  loadDevices();
</script>
</body>
</html>
